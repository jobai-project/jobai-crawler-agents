# === 그리팅(Greeting) ATS 템플릿 ===
# 한국형 ATS. 회사별 채용 사이트는 {subdomain}.career.greetinghr.com.
# 공식 API 는 인증 필요하지만, 채용 페이지의 __NEXT_DATA__ 에 공고가 박혀 있음(React Query 캐시).
# 사용법: {subdomain} 만 회사값으로 치환 (예: kakaopay).
company: kakaopay
company_name_ko: 카카오페이
entry_url: https://kakaopay.career.greetinghr.com/ko/main

crawler: declarative
source_type: embedded_json          # HTML → __NEXT_DATA__ → JSON 매핑

list:
  url: https://kakaopay.career.greetinghr.com/ko/main
  method: GET
  script_id: __NEXT_DATA__
  # React Query 캐시: queries 배열에서 queryKey==["openings"] 항목의 state.data 가 공고 배열
  select:
    array: props.pageProps.dehydratedState.queries
    match_field: queryKey
    match_value: ["openings"]
    take: state.data

pagination:
  type: none                        # 페이지에 전체가 박힘

required: [job_id, title]

fields:
  job_id: openingId
  title: title
  posted_at: openDate
  deadline: dueDate
  # 직무/근무지/경력/고용형태는 첫 포지션 객체에 중첩
  job_category: openingJobPosition.openingJobPositions[].workspaceOccupation.occupation
  location: openingJobPosition.openingJobPositions[].workspacePlace.place
  career: openingJobPosition.openingJobPositions[].jobPositionCareer.careerType
  employee_type: openingJobPosition.openingJobPositions[].jobPositionEmployment.employmentType

apply_url:
  template: https://kakaopay.career.greetinghr.com/ko/o/{job_id}

detail:
  enabled: true
  source_type: embedded_json
  url_from: apply_url
  script_id: __NEXT_DATA__
  select:
    array: props.pageProps.dehydratedState.queries
    match_field: queryKey
    match_prefix: ["career", "getOpeningById"]
    take: state.data.data
  fields:
    description: openingsInfo.detail

extra:
  d_day: deadlineDDay
