# 자동 생성됨 (분석 에이전트). 회사=daangn
# 분류: greenhouse 공개 API 확인 (board=daangn)
# ATS: greenhouse (board=daangn)
company: daangn
source_type: json
crawler: declarative
list:
  url: https://boards-api.greenhouse.io/v1/boards/daangn/jobs
  params:
    content: 'true'
  response_path: jobs
pagination:
  type: none
required:
- job_id
- title
- updated_at
fields:
  job_id: id
  title: title
  updated_at: updated_at
  location: location.name
  description: content
apply_url:
  template: "https://about.daangn.com/jobs/{job_id}/"